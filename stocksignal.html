<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSignal KI</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --blue: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 20px; font-weight: 700; color: var(--blue); white-space: nowrap; }
  .logo span { color: var(--green); }
  .status-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .clock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  .api-btn { background: var(--border); border: none; color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .api-btn:hover { background: #444c56; }

  .sectors { padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all .2s; white-space: nowrap; }
  .pill:hover, .pill.active { background: var(--blue); border-color: var(--blue); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 0 20px 20px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; transition: border-color .2s, transform .1s; }
  .card:hover { border-color: var(--blue); transform: translateY(-2px); }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .card-symbol { font-weight: 700; font-size: 16px; }
  .card-name { font-size: 11px; color: var(--muted); margin-top: 2px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .signal { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
  .signal-BUY { background: rgba(63,185,80,.2); color: var(--green); }
  .signal-HOLD { background: rgba(210,153,34,.2); color: var(--yellow); }
  .signal-SELL { background: rgba(248,81,73,.2); color: var(--red); }
  .card-price { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .card-change { font-size: 13px; }
  .card-change.pos { color: var(--green); }
  .card-change.neg { color: var(--red); }
  .card-meta { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .score-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 2px; transition: width .5s; }
  .score-fill.buy { background: var(--green); }
  .score-fill.hold { background: var(--yellow); }
  .score-fill.sell { background: var(--red); }

  .shimmer { background: linear-gradient(90deg, var(--surface) 25%, #21262d 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; display: block; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 420px; max-width: 95vw; }
  .modal h3 { margin-bottom: 12px; }
  .modal input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
  .modal input:focus { outline: none; border-color: var(--blue); }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .btn-primary { background: var(--blue); border: none; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn-secondary { background: var(--border); border: none; color: var(--text); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }

  .detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; align-items: center; justify-content: center; }
  .detail-overlay.open { display: flex; }
  .detail { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 520px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
  .detail-close { float: right; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }
  .detail-section { margin-top: 16px; }
  .detail-section h4 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; letter-spacing: .05em; }
  .detail-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .detail-row:last-child { border-bottom: none; }
  .indicator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .indicator-box { background: var(--bg); border-radius: 8px; padding: 10px; }
  .indicator-box .lbl { font-size: 11px; color: var(--muted); }
  .indicator-box .val { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .indicator-box .sub { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Stock<span>Signal</span> KI</div>
  <div class="status-badge">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Verbinde…</span>
  </div>
  <div class="clock" id="clock">--:--:--</div>
  <button class="api-btn" onclick="openApiModal()">🔑 API-Key</button>
</div>

<div class="sectors" id="sectors"></div>
<div class="grid" id="grid"></div>

<div class="modal-overlay" id="apiModal">
  <div class="modal">
    <h3>🔑 Twelve Data API-Key</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Kostenlos unter <a href="https://twelvedata.com" target="_blank" style="color:var(--blue)">twelvedata.com</a> registrieren (800 Req/Tag)</p>
    <input type="text" id="apiKeyInput" placeholder="dein-api-key-hier" />
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeApiModal()">Abbrechen</button>
      <button class="btn-primary" onclick="saveApiKey()">Speichern</button>
    </div>
  </div>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail" id="detailPanel">
    <button class="detail-close" onclick="getEl('detailOverlay').classList.remove('open')">×</button>
    <div id="detailContent"></div>
  </div>
</div>

<script>
// ── CONSTANTS ──────────────────────────────────────────────────────────────

var SYMS = ['TEAM','NVO','NFLX','ORCL','SAP','DTE','SNOW','ADP','COIN','HUM','ELV','CRM','UNH','NOW','ABT'];

var SECTOR = {
  AAPL:'Tech',MSFT:'Tech',NVDA:'Tech',GOOGL:'Tech',META:'Medien',
  AMZN:'Handel',TSLA:'Auto',JPM:'Finanzen',GS:'Finanzen','BRK-B':'Finanzen',
  V:'Finanzen',MA:'Finanzen',JNJ:'Gesundheit',UNH:'Gesundheit',NVO:'Gesundheit',
  XOM:'Energie',CVX:'Energie',NFLX:'Medien',DIS:'Medien',BABA:'Handel',
  SAP:'Tech',ASML:'Tech',ORCL:'Tech',CRM:'Tech',NOW:'Tech',
  SNOW:'Tech',COIN:'Finanzen',ADP:'Tech',TEAM:'Tech',ABT:'Gesundheit',
  HUM:'Gesundheit',ELV:'Gesundheit',DTE:'Energie'
};

// € only for SAP and DTE, all others $
var CURRENCY = { SAP:'€', DTE:'€' };

// ── STATE ──────────────────────────────────────────────────────────────────

var proxyOK = false;
var proxyType = 'none';
var twelveKey = '';
try { twelveKey = localStorage.getItem('twelveKey') || ''; } catch(e) {}
var stockData = {};
var activeSector = 'Alle';

// ── HELPERS ────────────────────────────────────────────────────────────────

function getEl(id) {
  return document.getElementById(id);
}

function fmt(n, d) {
  d = (d === undefined) ? 2 : d;
  if (n === null || n === undefined || n !== n) return 'N/A';
  return Number(n).toLocaleString('de-DE', {minimumFractionDigits:d, maximumFractionDigits:d});
}

function fmtPct(n) {
  if (n === null || n === undefined || n !== n) return 'N/A';
  return (n > 0 ? '+' : '') + Number(n).toFixed(2) + '%';
}

function fmtPrice(n, sym) {
  var cur = CURRENCY[sym] || '$';
  return cur + fmt(n);
}

function getSignal(score) {
  if (score >= 60) return 'BUY';
  if (score <= 40) return 'SELL';
  return 'HOLD';
}

// ── CLOCK ──────────────────────────────────────────────────────────────────

setInterval(function() {
  var el = getEl('clock');
  if (el) {
    el.textContent = new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }
}, 1000);

// ── PROXY CHECK ────────────────────────────────────────────────────────────

async function checkProxy() {
  if (window.electronAPI) {
    proxyOK = true; proxyType = 'electron';
    var d = getEl('statusDot'); var t = getEl('statusText');
    if (d) d.classList.add('live');
    if (t) t.textContent = '🖥️ App';
    return;
  }
  if (window.location.protocol === 'https:') {
    proxyOK = true; proxyType = 'netlify';
    var d = getEl('statusDot'); var t = getEl('statusText');
    if (d) d.classList.add('live');
    if (t) t.textContent = '🌐 Live';
    return;
  }
  try {
    var r = await fetch('http://localhost:8766/health', {signal: AbortSignal.timeout(700)});
    if (r.ok) {
      proxyOK = true; proxyType = 'local';
      var d = getEl('statusDot'); var t = getEl('statusText');
      if (d) d.classList.add('live');
      if (t) t.textContent = '⚡ Lokal';
      return;
    }
  } catch(e) {}
  var t = getEl('statusText');
  if (t) t.textContent = 'Fallback';
}

// ── FETCH QUOTES ───────────────────────────────────────────────────────────

async function batchQuote(syms) {
  if (proxyType === 'electron') {
    try {
      var j = await window.electronAPI.quote(syms.join(','));
      var map = {};
      var res = (j && j.quoteResponse && j.quoteResponse.result) ? j.quoteResponse.result : [];
      res.forEach(function(q) { map[q.symbol] = q; });
      return map;
    } catch(e) { return null; }
  }
  if (!proxyOK) return null;
  try {
    var url = '/api/quote?symbols=' + encodeURIComponent(syms.join(','));
    var r = await fetch(url, {signal: AbortSignal.timeout(8000)});
    if (!r.ok) return null;
    var j = await r.json();
    var map = {};
    var res = (j && j.quoteResponse && j.quoteResponse.result) ? j.quoteResponse.result : [];
    res.forEach(function(q) {
      var pct = q.regularMarketChangePercent || 0;
      if (Math.abs(pct) > 25) return; // filter bad data
      map[q.symbol] = q;
    });
    return map;
  } catch(e) { return null; }
}

async function fetchChart(sym) {
  if (proxyType === 'electron') {
    try {
      var j = await window.electronAPI.chart(sym);
      return (j && j.chart && j.chart.result && j.chart.result[0]) || null;
    } catch(e) { return null; }
  }
  if (!proxyOK) return null;
  try {
    var r = await fetch('/api/chart?symbol=' + encodeURIComponent(sym), {signal: AbortSignal.timeout(8000)});
    if (!r.ok) return null;
    var j = await r.json();
    return (j && j.chart && j.chart.result && j.chart.result[0]) || null;
  } catch(e) { return null; }
}

async function fetchTwelve(sym) {
  if (!twelveKey) return null;
  try {
    var url = 'https://api.twelvedata.com/quote?symbol=' + encodeURIComponent(sym) + '&apikey=' + encodeURIComponent(twelveKey);
    var r = await fetch(url, {signal: AbortSignal.timeout(6000)});
    if (!r.ok) return null;
    var j = await r.json();
    if (!j || j.status === 'error' || !j.close) return null;
    var price = parseFloat(j.close);
    var prev = parseFloat(j.previous_close);
    var change = price - prev;
    var pct = prev ? (change / prev) * 100 : 0;
    if (Math.abs(pct) > 25) return null;
    return {
      symbol: sym,
      regularMarketPrice: price,
      regularMarketChange: change,
      regularMarketChangePercent: pct,
      regularMarketPreviousClose: prev,
      longName: j.name || sym
    };
  } catch(e) { return null; }
}

// ── TECHNICAL ANALYSIS ─────────────────────────────────────────────────────

function calcRSI(arr, period) {
  if (!arr || arr.length < period + 1) return null;
  var gains = 0, losses = 0;
  for (var i = arr.length - period; i < arr.length; i++) {
    var d = arr[i] - arr[i-1];
    if (d >= 0) gains += d; else losses -= d;
  }
  var ag = gains / period, al = losses / period;
  if (al === 0) return 100;
  return 100 - (100 / (1 + ag / al));
}

function calcSMA(arr, period) {
  if (!arr || arr.length < period) return null;
  var s = arr.slice(arr.length - period);
  return s.reduce(function(a,b){return a+b;}, 0) / period;
}

function calcEMA(arr, period) {
  if (!arr || arr.length < period) return null;
  var k = 2 / (period + 1);
  var ema = arr.slice(0, period).reduce(function(a,b){return a+b;}, 0) / period;
  for (var i = period; i < arr.length; i++) ema = arr[i]*k + ema*(1-k);
  return ema;
}

function calcMACD(arr) {
  if (!arr || arr.length < 26) return null;
  var e12 = calcEMA(arr, 12), e26 = calcEMA(arr, 26);
  if (e12 === null || e26 === null) return null;
  return e12 - e26;
}

function calcScore(q, chart) {
  var score = 50;
  if (q) {
    var pct = q.regularMarketChangePercent || 0;
    var price = q.regularMarketPrice || 0;
    var hi = q.fiftyTwoWeekHigh || price;
    var lo = q.fiftyTwoWeekLow || price;
    if (pct > 2) score += 8;
    else if (pct > 0) score += 4;
    else if (pct < -2) score -= 8;
    else if (pct < 0) score -= 4;
    var range = hi - lo;
    if (range > 0) {
      var pos = (price - lo) / range;
      if (pos > 0.8) score += 5;
      else if (pos < 0.2) score -= 5;
    }
  }
  if (chart) {
    var qdata = chart.indicators && chart.indicators.quote && chart.indicators.quote[0];
    var closes = qdata ? (qdata.close || []) : [];
    closes = closes.filter(function(v){ return v !== null && v !== undefined; });
    if (closes.length >= 14) {
      var rsi = calcRSI(closes, 14);
      if (rsi !== null) {
        if (rsi < 30) score += 10;
        else if (rsi < 40) score += 5;
        else if (rsi > 70) score -= 10;
        else if (rsi > 60) score -= 5;
      }
      var sma = calcSMA(closes, Math.min(50, closes.length));
      var cur = closes[closes.length-1];
      if (sma !== null && cur !== null) {
        if (cur > sma * 1.02) score += 6;
        else if (cur < sma * 0.98) score -= 6;
      }
      var macd = calcMACD(closes);
      if (macd !== null) { if (macd > 0) score += 5; else score -= 5; }
    }
  }
  return Math.max(0, Math.min(100, score));
}

// ── SECTORS ────────────────────────────────────────────────────────────────

function buildSectors() {
  var el = getEl('sectors');
  if (!el) return;
  var list = ['Alle'];
  SYMS.forEach(function(s) { var sec = SECTOR[s]; if (sec && list.indexOf(sec) === -1) list.push(sec); });
  el.innerHTML = '';
  list.forEach(function(sec) {
    var p = document.createElement('div');
    p.className = 'pill' + (sec === activeSector ? ' active' : '');
    p.textContent = sec;
    p.onclick = function() {
      activeSector = sec;
      document.querySelectorAll('.pill').forEach(function(x){ x.classList.remove('active'); });
      p.classList.add('active');
      renderGrid();
    };
    el.appendChild(p);
  });
}

// ── GRID ───────────────────────────────────────────────────────────────────

function renderGrid() {
  var el = getEl('grid');
  if (!el) return;
  var syms = SYMS.filter(function(s) {
    return activeSector === 'Alle' || (SECTOR[s] || '') === activeSector;
  });
  el.innerHTML = '';
  syms.forEach(function(sym) {
    var card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('data-sym', sym);
    card.innerHTML = makeCardHTML(sym, stockData[sym]);
    card.onclick = function() { openDetail(sym); };
    el.appendChild(card);
  });
}

function makeCardHTML(sym, d) {
  if (!d) {
    return '<div class="card-header">' +
      '<div><div class="card-symbol">' + sym + '</div>' +
      '<span class="shimmer" style="width:120px;height:11px;margin-top:4px;display:block"></span></div>' +
      '<div class="signal signal-HOLD">…</div></div>' +
      '<span class="shimmer" style="width:100px;height:22px;margin-bottom:4px;display:block"></span>' +
      '<span class="shimmer" style="width:80px;height:13px;display:block"></span>' +
      '<div class="score-bar" style="margin-top:10px"><div class="score-fill hold" style="width:50%"></div></div>';
  }
  var score = d.score || 50;
  var sig = getSignal(score);
  var price = d.regularMarketPrice;
  var change = d.regularMarketChange || 0;
  var pct = d.regularMarketChangePercent || 0;
  var name = d.longName || d.shortName || sym;
  var pos = pct >= 0;
  var fc = sig === 'BUY' ? 'buy' : sig === 'SELL' ? 'sell' : 'hold';
  return '<div class="card-header">' +
    '<div><div class="card-symbol">' + sym + '</div>' +
    '<div class="card-name" title="' + name + '">' + name + '</div></div>' +
    '<div class="signal signal-' + sig + '">' + sig + '</div></div>' +
    '<div class="card-price">' + fmtPrice(price, sym) + '</div>' +
    '<div class="card-change ' + (pos?'pos':'neg') + '">' + (pos?'▲':'▼') + ' ' + fmtPrice(Math.abs(change), sym) + ' (' + fmtPct(pct) + ')</div>' +
    '<div class="card-meta"><span>Score: ' + Math.round(score) + '/100</span><span>' + (SECTOR[sym]||'') + '</span></div>' +
    '<div class="score-bar"><div class="score-fill ' + fc + '" style="width:' + score + '%"></div></div>';
}

function updateCard(sym) {
  var card = document.querySelector('[data-sym="' + sym + '"]');
  if (!card) return;
  card.innerHTML = makeCardHTML(sym, stockData[sym]);
  card.onclick = function() { openDetail(sym); };
}

// ── DETAIL ────────────────────────────────────────────────────────────────

function openDetail(sym) {
  var overlay = getEl('detailOverlay');
  var content = getEl('detailContent');
  if (!overlay || !content) return;
  var d = stockData[sym];
  if (!d) {
    content.innerHTML = '<h2>' + sym + '</h2><p style="color:var(--muted);margin-top:12px">Daten werden geladen…</p>';
  } else {
    var score = d.score || 50;
    var sig = getSignal(score);
    var price = d.regularMarketPrice;
    var change = d.regularMarketChange || 0;
    var pct = d.regularMarketChangePercent || 0;
    var name = d.longName || d.shortName || sym;
    var pos = pct >= 0;
    var rsi = d.rsi;
    var sma = d.sma50;
    var macd = d.macd;
    var rsiColor = rsi !== null && rsi !== undefined ? (rsi < 30 ? 'var(--green)' : rsi > 70 ? 'var(--red)' : 'var(--text)') : 'var(--muted)';
    var rsiText = rsi !== null && rsi !== undefined ? (rsi < 30 ? 'Überverkauft' : rsi > 70 ? 'Überkauft' : 'Neutral') : '–';
    var macdColor = macd !== null && macd !== undefined ? (macd > 0 ? 'var(--green)' : 'var(--red)') : 'var(--muted)';
    content.innerHTML =
      '<h2 style="font-size:22px">' + sym + ' <span style="font-size:14px;color:var(--muted)">' + name + '</span></h2>' +
      '<div style="margin-top:8px;display:flex;align-items:center;gap:12px">' +
        '<span style="font-size:28px;font-weight:700">' + fmtPrice(price, sym) + '</span>' +
        '<span class="signal signal-' + sig + '" style="font-size:14px">' + sig + '</span>' +
      '</div>' +
      '<div class="card-change ' + (pos?'pos':'neg') + '" style="font-size:14px;margin-top:4px">' +
        (pos?'▲':'▼') + ' ' + fmtPrice(Math.abs(change), sym) + ' (' + fmtPct(pct) + ') heute</div>' +
      '<div class="detail-section"><h4>Kursdaten</h4>' +
        '<div class="detail-row"><span>Kurs</span><span>' + fmtPrice(price, sym) + '</span></div>' +
        '<div class="detail-row"><span>52W Hoch</span><span>' + fmtPrice(d.fiftyTwoWeekHigh, sym) + '</span></div>' +
        '<div class="detail-row"><span>52W Tief</span><span>' + fmtPrice(d.fiftyTwoWeekLow, sym) + '</span></div>' +
        '<div class="detail-row"><span>Vortag</span><span>' + fmtPrice(d.regularMarketPreviousClose, sym) + '</span></div>' +
      '</div>' +
      '<div class="detail-section"><h4>Indikatoren</h4>' +
        '<div class="indicator-grid">' +
          '<div class="indicator-box"><div class="lbl">RSI (14)</div><div class="val" style="color:' + rsiColor + '">' + (rsi !== null && rsi !== undefined ? fmt(rsi,1) : 'N/A') + '</div><div class="sub">' + rsiText + '</div></div>' +
          '<div class="indicator-box"><div class="lbl">SMA 50</div><div class="val">' + (sma !== null && sma !== undefined ? fmtPrice(sma, sym) : 'N/A') + '</div><div class="sub">' + (sma !== null && sma !== undefined && price !== null ? (price > sma ? 'Über SMA' : 'Unter SMA') : '–') + '</div></div>' +
          '<div class="indicator-box"><div class="lbl">MACD</div><div class="val" style="color:' + macdColor + '">' + (macd !== null && macd !== undefined ? fmt(macd,3) : 'N/A') + '</div><div class="sub">' + (macd !== null && macd !== undefined ? (macd > 0 ? 'Bullisch' : 'Bärisch') : '–') + '</div></div>' +
          '<div class="indicator-box"><div class="lbl">Score</div><div class="val">' + Math.round(score) + '/100</div><div class="sub">' + sig + '</div></div>' +
        '</div>' +
      '</div>';
  }
  overlay.classList.add('open');
}

getEl('detailOverlay').addEventListener('click', function(e) {
  if (e.target === getEl('detailOverlay')) getEl('detailOverlay').classList.remove('open');
});

// ── API KEY MODAL ─────────────────────────────────────────────────────────

function openApiModal() {
  var inp = getEl('apiKeyInput');
  if (inp) inp.value = twelveKey;
  var m = getEl('apiModal');
  if (m) m.classList.add('open');
}

function closeApiModal() {
  var m = getEl('apiModal');
  if (m) m.classList.remove('open');
}

function saveApiKey() {
  var inp = getEl('apiKeyInput');
  if (inp) {
    twelveKey = inp.value.trim();
    try { localStorage.setItem('twelveKey', twelveKey); } catch(e) {}
  }
  closeApiModal();
  loadAll();
}

// ── LOAD DATA ─────────────────────────────────────────────────────────────

async function loadAll() {
  renderGrid(); // show skeletons

  for (var i = 0; i < SYMS.length; i += 10) {
    var batch = SYMS.slice(i, i + 10);
    var map = await batchQuote(batch);

    for (var k = 0; k < batch.length; k++) {
      var sym = batch[k];
      var q = (map && map[sym]) ? map[sym] : null;

      // Try Twelve Data as fallback
      if (!q && twelveKey) {
        q = await fetchTwelve(sym);
      }

      if (q) {
        var chart = await fetchChart(sym);
        var score = calcScore(q, chart);

        var closes = null;
        if (chart && chart.indicators && chart.indicators.quote && chart.indicators.quote[0]) {
          var raw = chart.indicators.quote[0].close || [];
          closes = raw.filter(function(v){ return v !== null && v !== undefined; });
        }

        stockData[sym] = Object.assign({}, q, {
          score: score,
          rsi:   closes && closes.length >= 14 ? calcRSI(closes, 14) : null,
          sma50: closes ? calcSMA(closes, Math.min(50, closes.length)) : null,
          macd:  closes ? calcMACD(closes) : null
        });
      } else {
        stockData[sym] = null;
      }

      updateCard(sym);
    }
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────

async function init() {
  buildSectors();
  renderGrid();
  await checkProxy();
  await loadAll();
  setInterval(loadAll, 60000);
}

init();
</script>
